

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraGrid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="topbar">
        <div class="logo">🌍 TerraGrid</div>

        <div id="playerInfo">
            <span id="currentPlayer">Spieler 1</span>
            <span id="territoryCount">Gebiete: 0</span>
            <span id="populationCount">Bevölkerung: 100 / 500</span>
            <span id="freePopulation">Frei: 100</span>
            <span id="moneyCount">Geld: 1 Mrd. €</span>
            <span id="troopCount">Truppen: 0</span>
            <span id="militaryBaseCount">Militärbasen: 0</span>
        </div>

        <div class="controls">
            <button id="switchPlayer">Spieler wechseln</button>
            <button id="pauseButton">Pause</button>
        </div>
    </header>

    <main id="gameArea">
        <canvas id="gameCanvas"></canvas>

        <div id="gameMessage">
            Erobere Land, baue Städte und produziere Geld.
        </div>

        <div id="buildingMenu">
            <button id="buildCityButton" class="building-button">
                <span class="building-icon">🏙️</span>
                <span>Stadt</span>
                <small>100 Mio. €</small>
            </button>

            <button id="buildFactoryButton" class="building-button">
                <span class="building-icon">🏭</span>
                <span>Fabrik</span>
                <small>250 Mio. €</small>
            </button>

            <button id="buildMilitaryBaseButton" class="building-button">
                <span class="building-icon">🪖</span>
                <span>Militärbasis</span>
                <small>200 Mio. €</small>
            </button>
        </div>
    </main>

    <script type="module" src="src/core/game.js"></script>

</body>
</html>
